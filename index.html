<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>추첨 프로그램 · 다트 + 핀볼</title>

.wrap{max-width:1280px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:.92rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.chips,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,.mp{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.chip[aria-pressed=true],.mp[aria-pressed=true]{border-color:var(--ac);font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(255,255,255,.35)}
.pri,.sec{font:inherit;font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer;border:2px solid var(--ac)}
.pri{background:var(--ac);color:#04121a}.sec{background:transparent;color:var(--ac)}
button:disabled{opacity:.4;cursor:not-allowed}
canvas{max-width:100%;height:auto;display:block;margin:10px auto}
.res{font-size:1.4rem;font-weight:800;text-align:center;min-height:2.2rem;display:flex;gap:8px;justify-content:center;align-items:center}
#n,#lo,#hi{width:80px;font:inherit;padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--sf);color:var(--tx)}
#res{display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-weight:700}
.badge{font-weight:700;display:inline-flex;align-items:center;gap:6px}
#hd{font-weight:800;font-size:1.1rem}
#dc{filter:drop-shadow(0 0 16px rgba(34,211,238,.35))}
#stage{position:relative;height:560px;min-height:420px;margin-top:12px;background:#000;border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:0 0 40px rgba(34,211,238,.12)}
#cam{position:absolute;top:0;left:0;width:100%;height:100%;margin:0;max-width:none}
#pc{position:absolute;left:12px;top:12px;height:480px;width:160px;margin:0;border:2px solid #1f9d3a;border-radius:4px;background:#111827;max-width:none}
#rk{position:absolute;right:16px;top:10px;text-align:right;max-height:calc(100% - 20px);overflow:hidden;pointer-events:none}
#hd{font-size:1.7rem;font-weight:800;color:rgba(255,255,255,.8);text-shadow:0 0 8px #000}
#res{display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-height:none;overflow:visible;margin:0}
#res .pill{border:0;padding:0;font-size:1.1rem;text-shadow:0 0 6px #000}
#gear{position:absolute;right:12px;bottom:12px;z-index:3;background:rgba(16,19,28,.92)}
#panel{position:absolute;right:12px;top:12px;z-index:3;width:min(292px,calc(100% - 24px));background:rgba(34,38,50,.96);border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.5);overflow:hidden}
#ph{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 5px 12px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;font-weight:700;font-size:.82rem;color:var(--mu);border-bottom:1px solid var(--bd)}
#pmin{background:none;border:0;color:var(--tx);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 8px}
#pb{padding:10px;display:flex;flex-direction:column;gap:8px}
#panel .r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#panel .r>b{min-width:40px;font-size:.82rem}
#panel .mp{padding:4px 9px;font-size:.8rem;border-width:1px}
#panel input[type=number]{width:58px;padding:4px 6px;font-size:16px;border-width:1px}
#panel .pri,#panel .sec{padding:5px 11px;font-size:.88rem;border-width:1px}
#panel .sub{font-size:.75rem}
#err{background:#7f1d1d;color:#fff;padding:8px 12px;font-size:.85rem;word-break:break-all}
button{-webkit-appearance:none;appearance:none}
#fin{position:absolute;top:0;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
#fin .box{background:rgba(16,19,28,.96);border:2px solid var(--ac);border-radius:20px;padding:22px 26px;text-align:center;max-width:min(92%,760px);max-height:90%;overflow:auto;box-shadow:0 0 40px rgba(34,211,238,.4)}
#fin h2{margin:0 0 14px;font-size:1.6rem}
#fl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#fl .w{display:inline-flex;align-items:center;gap:8px;font-size:1.6rem;font-weight:800;padding:6px 16px;border:1px solid var(--bd);border-radius:12px;background:#0b0e16}
@media(max-width:700px){#pc{left:6px;top:6px;height:46%}#hd{font-size:1.2rem}}
[hidden]{display:none!important}#s1{max-width:640px;margin:0 auto}

<h1>추첨 프로그램</h1>

 <b>다트판에 넣을 색상을 고르세요</b> <span class="sub">(최대 10개, 최소 2개 · 선택 <span id="cnt">5</span>/10)</span>
 <div class="chips" id="chips" style="margin-top:10px"></div>
 <canvas id="dc" width="420" height="440"></canvas>
 <div class="row" style="justify-content:center"><b>회전 속도</b><input id="dsp" type="range" min="1" max="10" step="0.5" value="7" style="width:200px" aria-label="회전 속도"><span id="dspv">7.0</span></div>
 <div class="res" id="dres"></div>
 <div class="row" style="justify-content:center;margin-top:10px">
  <button class="pri" id="throw">다트 던지기</button>
  <button class="sec" id="next" disabled>다음 게임으로</button>
 </div>
</section>

<section id="s2" hidden>
 <div class="card row" style="justify-content:space-between">
  <span class="badge">다트 색상: <span class="dot" id="bdot"></span><span id="bname"></span></span>
  <button class="sec" id="home">처음으로</button>
 </div>
 <div id="stage">
  <canvas id="cam" aria-label="경기 화면"></canvas>
  <canvas id="pc" width="200" height="600" aria-label="미리보기 맵"></canvas>
  <div id="rk"><div id="hd">대기 중</div><div id="res"></div></div>
  <button class="sec" id="gear" hidden>⚙ 설정</button>
  <div id="panel">
   <div id="ph"><span>⠿ 설정 (드래그로 이동)</span><button id="pmin" aria-label="접기">–</button></div>
   <div id="pb">
    <div class="r"><b>맵</b><div class="row" id="maps" style="gap:4px"></div></div>
    <div class="r"><b>번호</b><input id="lo" type="number" value="1"> ~ <input id="hi" type="number" value="100"><span class="sub" style="margin:0">최대 300</span></div>
    <div class="r"><b>속도</b><input id="sp" type="range" min="0.2" max="2" step="0.1" value="0.3" style="flex:1;min-width:90px" aria-label="속도"><span id="spv" style="font-size:.82rem">0.3x</span></div>
    <div class="r"><b>당첨자</b><input id="n" type="number" min="1" value="3"> 명<span style="flex:1"></span><button class="sec" id="rs">다시</button><button class="pri" id="go">▶ 시작</button></div>
   </div>
  </div>
  <div id="fin" hidden><div class="box"><h2>🎉 최종 당첨</h2><div id="fl"></div><div class="row" style="justify-content:center;margin-top:16px"><button class="sec" id="fclose">닫기</button><button class="pri" id="fagain">다시 하기</button></div></div></div>
 </div>
</section>
</div>

    return; var mx = stage.clientWidth - P.offsetWidth - 4, my = stage.clientHeight - P.offsetHeight - 4; P.style.left = Math.max(4, Math.min(mx, parseFloat(P.style.left) || 0)) + 'px'; P.style.top = Math.max(4, Math.min(my, parseFloat(P.style.top) || 0)) + 'px'; }
function fit() { var h = Math.max(420, Math.min((window.innerHeight || 700) * .82, 780)); stage.style.height = h + 'px'; pc.style.height = (h - 24) + 'px'; pc.style.width = ((h - 24) / 3) + 'px'; clampP(); }
window.addEventListener('resize', fit);

(function () {
    var P = $('#panel'), hh = $('#ph');

var last = performance.now();

        if (S.run) {

        ;
        drawP();
